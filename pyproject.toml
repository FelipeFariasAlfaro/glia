[project]
name = "glia-memory"
version = "0.4.1"
description = "Persistent holographic distributed memory for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Felipe Farías Alfaro"}
]
keywords = ["memory", "ai", "agents", "holographic-memory", "hdm", "vsa", "resonance", "mcp"]
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "mcp>=1.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/FelipeFariasAlfaro/glia"
Repository = "https://github.com/FelipeFariasAlfaro/glia"
Issues = "https://github.com/FelipeFariasAlfaro/glia/issues"

[project.scripts]
glia = "glia.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
